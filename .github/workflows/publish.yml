name: Publish release

on:
  workflow_dispatch:
    inputs:
      release-pr:
        description: Merged release PR number to retry before npm publication
        required: true
        type: string
  pull_request_target:
    types: [closed]

permissions:
  contents: read
  pull-requests: read
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.pull_request.merged == true &&
       github.event.pull_request.base.ref == 'main' &&
       github.event.pull_request.head.ref == 'changeset-release/main' &&
       github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Resolve merged release PR
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR: ${{ inputs.release-pr || github.event.pull_request.number }}
        run: |
          [[ "$RELEASE_PR" =~ ^[1-9][0-9]*$ ]] || exit 1
          gh api "repos/$GITHUB_REPOSITORY/pulls/$RELEASE_PR" > "$RUNNER_TEMP/release-pr.json"
          jq -e --arg repo "$GITHUB_REPOSITORY" '
            .merged == true and
            .base.ref == "main" and
            .head.ref == "changeset-release/main" and
            .base.repo.full_name == $repo and
            .head.repo.full_name == $repo and
            (.merge_commit_sha | test("^[0-9a-f]{40}$"))
          ' "$RUNNER_TEMP/release-pr.json"
          jq '{pull_request: .}' "$RUNNER_TEMP/release-pr.json" > "$RUNNER_TEMP/release-event.json"
          echo "sha=$(jq -r .merge_commit_sha "$RUNNER_TEMP/release-pr.json")" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.target.outputs.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          registry-url: https://registry.npmjs.org
      - name: Install compatible npm
        run: npm install --global npm@12.0.2
      - run: npm ci --ignore-scripts
      - name: Create repository-scoped App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-workflows: write
          permission-metadata: read
      - name: Validate merged release and conflicts
        id: release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_APP_BOT_LOGIN: ${{ steps.app-token.outputs.app-slug }}[bot]
        run: |
          cp "$RUNNER_TEMP/release-event.json" "$GITHUB_EVENT_PATH"
          ./node_modules/.bin/tsx scripts/release/publish.ts
      - run: npm run check
      - name: Pack once
        id: pack
        run: |
          mkdir artifacts
          npm pack --ignore-scripts --json --pack-destination artifacts > artifacts/pack.json
          tarball=$(jq -er '
            (if type == "array" and length == 1 then .[0]
             elif type == "object" then .["pi-typesafe-router"]
             else error("unexpected npm pack output") end)
            | .filename
            | select(type == "string" and test("^[A-Za-z0-9][A-Za-z0-9._-]*\\.tgz$"))
          ' artifacts/pack.json)
          test -f "artifacts/$tarball"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
      - name: Smoke-test publish tarball
        env:
          PACKAGE_TARBALL: ${{ github.workspace }}/artifacts/${{ steps.pack.outputs.tarball }}
        run: node scripts/package-smoke.mjs
      - name: Publish exact tarball with npm OIDC
        run: npm publish "./artifacts/${{ steps.pack.outputs.tarball }}" --ignore-scripts --access public --provenance --tag latest
      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          if ! gh release create "${{ steps.release.outputs.tag }}" \
            --target "${{ steps.release.outputs.sha }}" \
            --title "${{ steps.release.outputs.tag }}" \
            --notes-file "${{ steps.release.outputs.notes }}"; then
            echo "::error::npm publication succeeded but GitHub finalization failed. Verify npm version ${{ steps.release.outputs.version }}, then create tag ${{ steps.release.outputs.tag }} at ${{ steps.release.outputs.sha }} and its GitHub Release manually; do not rerun publication blindly."
            exit 1
          fi
