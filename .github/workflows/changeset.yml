name: Release changeset

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, labeled, unlabeled]

permissions: {}

concurrency:
  group: changeset-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  reject-fork:
    if: github.event.pull_request.head.repo.id != github.event.pull_request.base.repo.id
    runs-on: ubuntu-24.04
    steps:
      - name: Reject fork pull request
        run: |
          echo "Fork pull requests cannot use privileged release automation. A maintainer must reproduce the change in this repository."
          exit 1

  changeset:
    if: github.event.pull_request.head.repo.id == github.event.pull_request.base.repo.id
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # pull_request_target must only execute trusted base-branch code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19.0
      - run: npm ci --ignore-scripts
      - name: Create repository-scoped App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-checks: write
          permission-metadata: read
          permission-pull-requests: read
      - name: Reconcile generated changeset
        env:
          GITHUB_APP_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_APP_BOT_LOGIN: ${{ steps.app-token.outputs.app-slug }}[bot]
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          RELEASE_CLASSIFIER_MODEL: ${{ vars.RELEASE_CLASSIFIER_MODEL }}
          RELEASE_WRITER_MODEL: ${{ vars.RELEASE_WRITER_MODEL }}
        run: ./node_modules/.bin/tsx scripts/release/pr.ts
